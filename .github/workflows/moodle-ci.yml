# Continuous integration with moodle-plugin-ci (the same checks the moodle.org
# plugin reviewers run).
name: Moodle Plugin CI

# Triggers:
#  - push to a branch: only the "quick" matrix entry (PHP 8.3 + Moodle 5.2 + MariaDB, with Behat);
#    if the commit starts with "release ", nothing runs (its tag runs the full matrix);
#  - push of a v* tag, pull request or manual run: the full matrix;
#  - changes only in docs/ or .md files do not trigger a run.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

# A new push to the same branch cancels the previous run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chooses which matrix entries run (GitHub cannot read `matrix` in a job-level `if`):
  # branch push = quick entry only; tag, pull request or manual = all entries.
  # A branch push whose commit starts with "release " runs nothing: its tag does.
  prepare:
    runs-on: ubuntu-22.04
    if: >-
      ${{ !(github.event_name == 'push' && github.ref_type == 'branch'
            && startsWith(github.event.head_commit.message, 'release ')) }}
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          FULL: '[{"php":"8.2","moodle-branch":"MOODLE_501_STABLE"},{"php":"8.3","moodle-branch":"MOODLE_502_STABLE","quick":true,"behat":true},{"php":"8.3","moodle-branch":"MOODLE_502_STABLE","db":"pgsql"},{"php":"8.3","moodle-branch":"MOODLE_503_STABLE","mariadb":"11.4"}]'
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            echo "include=$(echo "$FULL" | jq -c '[.[] | select(.quick == true)]')" >> "$GITHUB_OUTPUT"
          else
            echo "include=$(echo "$FULL" | jq -c .)" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: prepare
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.experimental || false }}

    services:
      mariadb:
        # Moodle 5.3 requires MariaDB 11.4: the MOODLE_503_STABLE entry asks for it; the rest use 10.11.
        image: mariadb:${{ matrix.mariadb || '10.11' }}
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.include) }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, gd, zip, intl, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.db || 'mariadb' }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker (phpcs)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Validate plugin structure
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ !cancelled() && matrix.behat }}
        run: moodle-plugin-ci behat --profile chrome --auto-rerun 2
